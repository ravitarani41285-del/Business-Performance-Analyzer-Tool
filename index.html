<!DOCTYPE html>
<html>
<head>
    <title>Business Performance Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
            font-weight: bold;
        }

        .contact {
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Business Performance Analyzer</h1>

    <p>Analyze your business sales, expenses and profit.</p>

    <h2>Business Details</h2>

    <label>Total Sales:</label>
    <input type="number" id="sales" placeholder="Enter total sales">

    <label>Total Expenses:</label>
    <input type="number" id="expenses" placeholder="Enter total expenses">

    <button onclick="analyzeBusiness()">Analyze Business</button>

    <div id="result">
        Enter sales and expenses, then click Analyze Business.
    </div>

    <div class="contact">
        <h2>Contact Me</h2>
        <p>Interested in this project or want to work with me?</p>
        <a href="contact.html">Open Contact Page</a>
    </div>

    <script>
        function analyzeBusiness() {
            let sales = Number(document.getElementById("sales").value);
            let expenses = Number(document.getElementById("expenses").value);

            if (sales === 0 && expenses === 0) {
                document.getElementById("result").innerHTML =
                    "Please enter sales and expenses.";
                return;
            }

            let profit = sales - expenses;

            document.getElementById("result").innerHTML =
                "Sales: " + sales +
                "<br>Expenses: " + expenses +
                "<br>Profit: " + profit;
        }
    </script>

</body>
</html>
